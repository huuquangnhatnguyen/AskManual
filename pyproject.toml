[project]
name = "askmanual"
version = "0.1.0"
description = "Cited answers from industrial drive manuals, with every claim expanding to its page region."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.121.0",
    "uvicorn==0.38.0",
    "python-multipart==0.0.20",
    "pydantic==2.12.0",
    "python-dotenv==1.2.1",
    "pymupdf==1.28.2",
    "pillow==12.3.0",
    "qdrant-client==1.19.1",
    "psycopg[binary]==3.3.6",
    "rank-bm25==0.2.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingest", "retrieval", "generation", "api", "eval"]
