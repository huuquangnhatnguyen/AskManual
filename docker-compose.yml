# Local backing services. The app itself runs outside compose for now:
#   uvicorn api.main:app            (AS0.5)
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: askmanual
      POSTGRES_DB: askmanual
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmanual -d askmanual"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_data:
  postgres_data:
